name: CI

on:
  push:
    paths-ignore: ["**.md", "docs/**"]  # documentation-only commits need no CI
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongodb/mongodb-atlas-local:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 3s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 40s
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      MONGODB_URI: mongodb://localhost:27017/?directConnection=true
      REDIS_URL: redis://localhost:6379/0
      REQUIRE_MONGO: "1"
      LOG_JSON: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.2.0  # this action publishes no floating major tag
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements*.txt
      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Pytest (with coverage floor)
        run: pytest --cov=apps --cov-report=term-missing:skip-covered --cov-fail-under=90

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest (with coverage floor)
        run: npm test -- --coverage
      - name: Build
        run: npm run build

  production:
    name: Production images (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Throwaway production environment
        run: |
          secret() { python3 -c 'import secrets; print(secrets.token_urlsafe(64))'; }
          {
            echo "FRONTEND_URL=https://repoguide.test"
            echo "DJANGO_ALLOWED_HOSTS=repoguide.test,localhost"
            echo "DJANGO_SECRET_KEY=$(secret)"
            echo "JWT_SIGNING_KEY=$(secret)"
            echo "GITHUB_CLIENT_ID=ci"
            echo "GITHUB_CLIENT_SECRET=ci"
            echo "TOKEN_ENCRYPTION_KEYS=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
            echo "MONGO_ROOT_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
            echo "LLM_BASE_URL=http://127.0.0.1:9/v1"
          } > .env
      - uses: docker/setup-buildx-action@v4
      # Layers are cached in the GitHub Actions cache: the ML layer (CPU torch) alone takes ~55 s
      # to build. worker and beat run the backend image, so only two images are built.
      - name: Build images
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.prod.yml
          targets: backend,frontend
          load: true
          set: |
            backend.cache-from=type=gha,scope=backend
            backend.cache-to=type=gha,scope=backend,mode=max
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,scope=frontend,mode=max
      - name: Start the stack
        run: docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 420
      - name: Smoke test
        run: sh scripts/prod-smoke-test.sh repoguide.test --sse
      - name: Service logs
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail 200

  e2e:
    name: E2E (Playwright, mocked backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The runner image already has the system libraries Chromium needs (it ships Google
      # Chrome); --with-deps re-ran apt and once took ~170 s on a slow mirror.
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Playwright
        run: npm run e2e
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
