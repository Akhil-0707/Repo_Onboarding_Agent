name: repoguide

x-backend: &backend
  build:
    context: ./backend
    args:
      INSTALL_DEV: "true"
  env_file:
    - path: .env
      required: false
  environment:
    MONGODB_URI: mongodb://${MONGO_ROOT_USER:-repoguide}:${MONGO_ROOT_PASSWORD:-repoguide}@mongo:27017/?directConnection=true&authSource=admin
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./backend:/app
    - hf_cache:/home/app/.cache/huggingface
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mongo:
    image: mongodb/mongodb-atlas-local:8.0
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-repoguide}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-repoguide}
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - mongot_data:/data/mongot
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    command: ["web"]
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-repoguide}:${MONGO_ROOT_PASSWORD:-repoguide}@mongo:27017/?directConnection=true&authSource=admin
      REDIS_URL: redis://redis:6379/0
      UVICORN_RELOAD: "1"
    ports:
      - "${BACKEND_HOST_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *backend
    command: ["worker"]
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-repoguide}:${MONGO_ROOT_PASSWORD:-repoguide}@mongo:27017/?directConnection=true&authSource=admin
      REDIS_URL: redis://redis:6379/0
      CELERY_RELOAD: "1"

  beat:
    <<: *backend
    command: ["beat"]
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-repoguide}:${MONGO_ROOT_PASSWORD:-repoguide}@mongo:27017/?directConnection=true&authSource=admin
      REDIS_URL: redis://redis:6379/0
      CELERY_RELOAD: "1"

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  hf_cache:
  mongo_data:
  mongo_config:
  mongot_data:
  frontend_node_modules:
